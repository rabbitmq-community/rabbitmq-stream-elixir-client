name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "test/**"
      - ".github/workflows/ci.yaml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/ci.yaml"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.15"

      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile --skip-umbrella-children --skip-local-deps

      - name: Build docs
        run: mix docs
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["4_3", "4_2", "3_13", "3_12", "3_11"]
        toolchain: ["1_15", "1_16", "1_20"]
        include:
          - toolchain: "1_15"
            elixir: "1.15"
            otp: "26"
          - toolchain: "1_16"
            elixir: "1.16"
            otp: "26"
          - toolchain: "1_20"
            elixir: "1.20"
            otp: "29"
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/checkout@v7

      - uses: isbang/compose-action@v3.1.0
        with:
          compose-file: "./services/docker-compose.yaml"
          services: "rabbitmq_stream_${{ matrix.version }}"
      
      - name: Wait RabbitMQ is Up
        run: sleep 10s
        shell: bash
      
      - name: Create 'invoices' SuperStream
        run: docker exec rabbitmq_stream rabbitmq-streams add_super_stream invoices --partitions 3

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.unlock --all
          mix deps.get
          mix deps.compile

      - name: Compile app
        run: mix compile

      - name: Run tests
        run:  mix test --exclude test --include v${{ matrix.version }}

  cluster-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rabbitmq_version: ["3.13", "4.3"]
        toolchain: ["1_15", "1_16", "1_20"]
        include:
          - toolchain: "1_15"
            elixir: "1.15"
            otp: "26"
          - toolchain: "1_16"
            elixir: "1.16"
            otp: "26"
          - toolchain: "1_20"
            elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@v7

      - name: Start RabbitMQ cluster
        run: docker compose --project-directory services/cluster up -d
        env:
          RABBITMQ_VERSION: ${{ matrix.rabbitmq_version }}

      - name: Wait for cluster to form
        run: |
          timeout 90s bash -c '
            until docker compose --project-directory services/cluster exec -T rabbitmq1 rabbitmqctl await_online_nodes 3; do
              sleep 2
            done
          '

      - name: Run cluster tests
        run: |
          docker run --network cluster_rabbitmq -v "${{ github.workspace }}:/home/rabbitmq-stream" elixir:${{ matrix.elixir }}-otp-${{ matrix.otp }} \
            /bin/sh -c 'cd /home/rabbitmq-stream; ./services/cluster/test.sh'
