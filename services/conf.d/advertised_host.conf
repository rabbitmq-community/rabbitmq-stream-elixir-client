# Only for services/docker-compose.yaml (single-node). The container's hostname
# (rabbitmq_stream) isn't reachable from the host/CI runner, which dials via the
# 5552:5552 port mapping as "localhost" instead. Without this, `query_metadata`
# reports a leader host that never matches the dialed address, so
# `RabbitMQStream.Connection.Router`'s seed-reuse check never fires for the right
# reason. Not applied to services/cluster or services/proxied-cluster, whose nodes
# are dialed by their real container hostnames (rabbitmq1/2/3) already.
stream.advertised_host = localhost
